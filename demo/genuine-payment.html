<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Demo: Real-looking receipt (should stay silent)</title>
  <style>body { font: 16px system-ui, Arial, sans-serif; max-width: 560px; margin: 40px auto; } button { font-size: 18px; padding: 10px 18px; }</style>
</head>
<body>
  <h1>Your bank (DEMO)</h1>
  <p>Rs 1,250.00 debited from A/c XX4521 on 10-Nov via UPI. Ref no 431256789. If not you, call the number on the back of your card.</p>
  <p>Reminder: Never share your OTP, PIN or CVV with anyone, including bank staff.</p>
  <button id="pay">Pay Now</button>
  <p id="result"></p>
  <script>
    document.getElementById("pay").addEventListener("click", () => {
      document.getElementById("result").textContent = "Payment submitted (demo only). Clippit stayed silent.";
    });
  </script>
</body>
</html>
